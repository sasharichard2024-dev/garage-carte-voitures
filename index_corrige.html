<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garage des cartes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6df;--ink:#1c1f26;--muted:#5d626d;--card:#f7f5f0;--line:#cfcabf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--ink:#eceae4;--muted:#9aa0ac;--card:#1f232b;--line:#333844}}
:root[data-theme="dark"]{--bg:#15181e;--ink:#eceae4;--muted:#9aa0ac;--card:#1f232b;--line:#333844}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,"Segoe UI",sans-serif;padding:16px;max-width:980px;margin-inline:auto}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;margin:0;letter-spacing:.01em}
h1{font-size:2.2rem}h2{font-size:1.4rem;margin:18px 0 8px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.coins{font:800 1.5rem "Barlow Condensed",sans-serif}
nav{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
button,select,input{font:inherit}
.tab,.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}
.tab[aria-selected="true"],.btn{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-top:7px solid var(--rc);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card b{font:800 1.1rem "Barlow Condensed",sans-serif}
.photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--line)}.art{font-size:2rem}.rar{font-weight:600;color:var(--muted)}.val{font-size:.9rem;color:var(--muted)}
.act{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.act input,.act select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.act .btn{padding:4px 8px;font-size:.9rem}
.nova{border-top-color:#fff;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px 2px #7dd3fc}}
@media (prefers-reduced-motion:reduce){.nova{animation:none;box-shadow:0 0 12px 1px #7dd3fc}}
.odds{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;padding:0;list-style:none;font-size:.9rem}
.odds li{border:1px solid var(--line);border-left:6px solid var(--rc);border-radius:6px;padding:2px 8px;background:var(--card)}
.note{color:var(--muted);max-width:70ch}
#msg{min-height:1.5em;font-weight:600}
.flip{display:grid;perspective:900px;cursor:pointer;min-width:0}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.flip .back{display:grid;place-items:center;min-height:210px;border-radius:10px;background:var(--ink);color:var(--bg);font:800 3.5rem "Barlow Condensed",sans-serif;border:6px solid var(--card)}
.flip .front{transform:rotateY(180deg)}
.flip.on .back{transform:rotateY(180deg)}
.flip.on .front{transform:rotateY(360deg)}
.flip:focus-visible{outline:3px solid #3b82f6;outline-offset:3px}
.flip.hot .front .card{animation:ring 1.1s ease-out}
.flip.hot .front .card.nova{animation:ring 1.1s ease-out,glow 2.4s ease-in-out 1.1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--rc)}100%{box-shadow:0 0 0 24px transparent}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--c),transparent 70%);opacity:0;animation:fl 1.1s ease-out}
#fx .flash.big{background:radial-gradient(circle at 50% 50%,#fff,var(--c) 40%,transparent 75%);animation-duration:1.6s}
#fx i{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:sp 1s ease-out forwards}
.nova-txt{position:absolute;left:0;right:0;top:32%;text-align:center;font:800 3.4rem "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 0 18px #7dd3fc,0 0 40px #7dd3fc;animation:nt 2s ease-out forwards}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes nt{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}
.card{position:relative;overflow:hidden;color:#1c1f26;border:0;border-radius:16px;padding:0;gap:0;background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 45%,#fff),color-mix(in srgb,var(--rc) 80%,#fff));box-shadow:0 2px 10px rgba(0,0,0,.25)}
.card::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 15% 120%,rgba(255,255,255,.3) 0 14px,transparent 14px 30px);pointer-events:none}
.card>*{position:relative}
.card .badge{position:absolute;top:8px;left:8px;z-index:2;background:var(--rc);color:#1c1f26;font:800 .85rem "Barlow Condensed",sans-serif;padding:1px 9px;border-radius:8px;border:2px solid rgba(255,255,255,.7)}
.card .pic{aspect-ratio:16/10;display:grid;place-items:center;background:rgba(28,31,38,.18);overflow:hidden}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .mono{font:800 2.6rem "Barlow Condensed",sans-serif;color:rgba(28,31,38,.75);letter-spacing:.03em}
.card b{display:block;padding:10px 12px 0;font:800 1.05rem/1.15 "Barlow Condensed",sans-serif;color:#1c1f26}
.card .sub{display:block;padding:2px 12px 8px;font-size:.8rem;color:rgba(28,31,38,.7)}
.card .stats{display:flex;justify-content:space-between;margin:0 12px;padding:8px 0 10px;border-top:1px solid rgba(28,31,38,.25);font:600 .85rem Barlow,sans-serif}
.card>.val,.card>.rar{display:block;padding:0 12px}
.card .val,.card .rar{color:rgba(28,31,38,.75)}
.card .act{padding:0 12px 12px}
.card .act label,.card .act span{color:#1c1f26}
.card .btn{background:#1c1f26;color:#f7f5f0;border-color:#1c1f26}
.card .btn.alt{background:transparent;color:#1c1f26}
.card .act input,.card .act select{background:#fff;color:#1c1f26;border-color:rgba(28,31,38,.3)}
.card input[type=file]{margin:0 12px 12px;max-width:calc(100% - 24px)}
.card.nova{background:linear-gradient(135deg,#a5f3fc,#e9d5ff,#fde68a)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.filters select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.prog{font-weight:600}
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.65);padding:16px;overflow:auto}
#modal[hidden]{display:none}
.mbox{position:relative;width:min(360px,100%)}
.mclose{position:absolute;top:-12px;right:-12px;z-index:5;width:34px;height:34px;padding:0;border-radius:50%;background:#14161b;color:#eceae4;border:1px solid #3a4050}
.open{cursor:pointer;border-radius:12px}
.open .card{transition:transform .15s}
.open:hover .card{transform:translateY(-3px)}
.open:focus-visible{outline:3px solid #3b82f6;outline-offset:3px}
.facts{display:grid;gap:2px;padding:6px 12px 8px;font-size:.85rem;color:#c9ced8}
.list{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.card{background:#14161b;color:#eceae4;border:1px solid #262a33;border-top:3px solid var(--rc);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card::before{background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%)}
.card .badge{background:var(--rc);color:#0d0f13;border:0;border-radius:6px;letter-spacing:.06em}
.card .pic{background:radial-gradient(ellipse at 50% 115%,color-mix(in srgb,var(--rc) 50%,transparent),transparent 62%),linear-gradient(#0d0f13,#161922)}
.card .mono{color:rgba(236,234,228,.88);text-shadow:0 0 24px var(--rc);font-size:3rem}
.card b{color:#f5f3ee}
.card .sub{color:#9aa0ac}
.card .bars{display:grid;gap:6px;margin:0 12px;padding:10px 0 12px;border-top:1px solid #262a33}
.card .bar{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:.78rem;color:#9aa0ac}
.card .bar i{height:6px;border-radius:3px;background:#262a33;position:relative;overflow:hidden}
.card .bar i::after{content:"";position:absolute;inset:0;width:var(--p);background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 60%,#fff),var(--rc));border-radius:3px}
.card .bar em{font-style:normal;color:#eceae4;font-weight:600;min-width:52px;text-align:right}
.card .val,.card .rar{color:#9aa0ac}
.card .act label,.card .act span{color:#c9ced8}
.card .btn{background:var(--rc);color:#0d0f13;border-color:var(--rc)}
.card .btn.alt{background:transparent;color:#eceae4;border-color:#3a4050}
.card .act input,.card .act select{background:#0d0f13;color:#eceae4;border-color:#3a4050}
.card.nova{background:#14161b}
.card.nova .pic{background:radial-gradient(ellipse at 50% 115%,#7dd3fc88,transparent 62%),linear-gradient(#0d0f13,#161922)}
.shelf{margin:22px 0 4px;padding-top:10px;border-top:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shelf h3{margin:0;font:800 1.5rem "Barlow Condensed",sans-serif;letter-spacing:.03em}
.shelf span{color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){.flip .face{transition:none}.flip.hot .front .card{animation:none}}

#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:20px}
#login .box{width:min(420px,100%);display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
#login h2{margin:0 0 4px}
#login p{margin:0;color:var(--muted);font-size:.95rem}
#login input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#login .err{color:#e5484d;min-height:1.3em;font-weight:600}
</style>
</head>

function burst(el,ri){

  const n=ri===8?36:ri===7?26:ri===6?18:10;
  for(let i=0;i<n;i++){
    const s=document.createElement('i'),a=Math.random()*6.283,d=60+Math.random()*(ri>=7?220:140);

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  const op=e.target.closest&&e.target.closest('[data-open]');if(op&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openCard(op.dataset.open);return}
  const fl=e.target.closest&&e.target.closest('.flip');
  if(fl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();flip(+fl.dataset.i)}
});
function claim(id){
  const qd=QUESTS.find(x=>x.id===id);if(!qd)return;
  if(qd.daily){if(me.daily===day())return;me.daily=day()}
  else{if(me.done.includes(id)||!qd.ok())return;me.done.push(id)}
  me.coins+=qd.r;flash('+'+qd.r+' pièces : '+qd.t);save();view();
}
const take=u=>{const i=me.cards.findIndex(k=>k.u===u);return i<0?null:me.cards.splice(i,1)[0]};
async function act(a,el){
  const box=el.closest('.card'),u=box&&box.dataset.u,id=el.dataset.id;
  try{
    if(a==='open'){
      if(me.coins<PACK)return;
      me.coins-=PACK;me.st.packs++;pulled=[pick(),pick(),pick()];me.cards.push(...pulled);startReveal();
      const best=Math.max(...pulled.map(k=>CARS[k.c][1]));flash(best>=6?'Belle prise : '+RAR[best].n+' !':'');
    }else if(a==='openfree'){
      accrue();if(me.free<1)return;
      if(me.free>=MAXF)me.fAt=Date.now();
      me.free--;me.st.packs++;pulled=[pick(),pick(),pick()];me.cards.push(...pulled);startReveal();
      const best=Math.max(...pulled.map(k=>CARS[k.c][1]));flash(best>=6?'Belle prise : '+RAR[best].n+' !':'');
    }else if(a==='bank'){
      const k=take(u);if(!k)return;me.coins+=Math.floor(RAR[CARS[k.c][1]].v/2);flash('Carte vendue à la banque.');
    }else if(a==='list'){
      const price=parseInt(box.querySelector('input').value,10);
      if(!(price>0)){flash('Indique un prix supérieur à 0.');return}
      const k=me.cards.find(x=>x.u===u);if(!k)return;
      await db.collection('market').add({seller:uid,card:k,price});take(u);me.st.listed++;flash('Carte mise en vente.');
    }else if(a==='post'){
      const k=me.cards.find(x=>x.u===u);if(!k)return;
      await db.collection('trades').add({from:uid,card:k,minR:parseInt(box.querySelector('select').value,10)});take(u);flash('Offre d’échange publiée.');
    }else if(a==='postf'){
      const k=me.cards.find(x=>x.u===u),to=box.querySelector('select[data-fr]').value;if(!k||!to)return;
      await db.collection('trades').add({from:uid,to,card:k,minR:parseInt(box.querySelector('select').value,10)});take(u);flash('Offre envoyée à '+nameOf(to)+'.');
    }else if(a==='buy'||a==='unlist'){
      const ref=db.doc('market/'+id),s=await ref.get();
      if(!s.exists){flash('Cette carte n’est plus disponible.');return}
      const l=s.data();
      if(a==='buy'){
        if(me.coins<l.price){flash('Pas assez de pièces.');return}
        await ref.delete();me.coins-=l.price;me.cards.push(l.card);
        await db.collection('inbox').add({to:l.seller,coins:l.price});flash('Achat réussi.');
      }else{await ref.delete();me.cards.push(l.card);flash('Carte retirée du marché.')}
    }else if(a==='accept'||a==='untrade'){
      const ref=db.doc('trades/'+id),s=await ref.get();
      if(!s.exists){flash('Cette offre n’existe plus.');return}
      const t=s.data();
      if(a==='untrade'){await ref.delete();me.cards.push(t.card);flash('Offre annulée.')}
      else{
        if(t.to&&t.to!==uid){flash('Cette offre est réservée à quelqu’un d’autre.');return}
        const mine=me.cards.find(k=>k.u===box.querySelector('select').value);
        if(!mine||CARS[mine.c][1]<t.minR){flash('Carte non éligible.');return}
        await ref.delete();take(mine.u);me.cards.push(t.card);
        await db.collection('inbox').add({to:t.from,card:mine});me.st.trades++;flash('Échange réussi.');
      }
    }
  }catch(e){flash('Action impossible pour le moment.');return}
  save();view();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;view();return}
  const op=e.target.closest('[data-open]');if(op){openCard(op.dataset.open);return}
  if(e.target.closest('[data-close]')||e.target.id==='modal'){closeModal();return}
  const fl=e.target.closest('.flip');if(fl){flip(+fl.dataset.i);return}
  const b=e.target.closest('[data-a]');if(b&&me){if(b.dataset.a==='claim')claim(b.dataset.id);else if(b.dataset.a==='revealall')revealAll();else if(b.dataset.a[0]==='f')friendAct(b.dataset.a,b.dataset.id);else act(b.dataset.a,b).then(closeModal)}
});
document.addEventListener('change',async e=>{
  const f=e.target.closest('input[data-car]');if(!f||!assets||!f.files[0])return;
  try{flash('Envoi de la photo…');const r=await assets.upload(f.files[0]);await db.doc('images/map').set({m:{...imgs,[f.dataset.car]:r.url}});flash('Photo enregistrée.')}
  catch(x){flash('Envoi impossible (photo trop lourde ou droits insuffisants).')}
});
async function loadNames(ids){
  const need=[...new Set(ids)].filter(i=>i&&!(i in names)&&i!==uid);if(!need.length)return;
  try{const ps=await user.profiles(need);need.forEach(i=>{names[i]=(ps[i]&&ps[i].name)||''});view()}catch(e){}
}
(async()=>{
  const slow=setTimeout(()=>flash('La connexion est lente… les données ne sont peut-être pas à jour.'),10000);
  try{user=window.claude&&await claude.use('user');db=window.claude&&await claude.use('db');assets=window.claude&&await claude.use('assets')}catch(e){}
  uid=user&&await user.id();
  if(!db||!uid){clearTimeout(slow);document.getElementById('main').innerHTML='<p class="note">Connexion impossible. Vérifie ta connexion internet, puis recharge la page. Si le problème continue, la configuration Firebase du site est peut-être incomplète.</p>';return}
  const s=await db.doc(gp()).get();
  me=s.exists?JSON.parse(JSON.stringify(s.data())):{coins:300,cards:[]};
  me.st=me.st||{packs:0,listed:0,trades:0};me.done=me.done||[];me.free=me.free??1;me.fAt=me.fAt||Date.now();accrue();
  if(!s.exists)await save();
  clearTimeout(slow);flash('');view();
  db.doc('images/map').onSnapshot(sn=>{const d=sn.exists&&sn.data();imgs=(d&&d.m)||{};view()});
  db.collection('players').onSnapshot(sn=>{players=sn.docs.map(d=>({id:d.id,cs:d.data().cs||[]}));loadNames(players.map(p=>p.id));if(tab==='friends')view()});
  const fr=()=>{friends=[...fa,...fb];loadNames(friends.flatMap(f=>[f.a,f.b]));if(tab==='friends')view()};
  db.collection('friends').where('a','==',uid).onSnapshot(sn=>{fa=sn.docs.map(d=>({id:d.id,...d.data()}));fr()});
  db.collection('friends').where('b','==',uid).onSnapshot(sn=>{fb=sn.docs.map(d=>({id:d.id,...d.data()}));fr()});
  save();
  setInterval(()=>{const f=me.free;accrue();if(f!==me.free&&tab==='packs')view();const c=document.getElementById('cd');if(c)c.textContent=me.free>=MAXF?'(réserve pleine)':'· prochain dans '+fmt(me.fAt+EVERY-Date.now())},1000);
  db.collection('market').onSnapshot(sn=>{market=sn.docs.map(d=>({id:d.id,...d.data()}));loadNames(market.map(l=>l.seller));if(tab==='market')view()});
  let tInit=false;
  db.collection('trades').onSnapshot(sn=>{const prev=new Set(trades.map(t=>t.id));trades=sn.docs.map(d=>({id:d.id,...d.data()}));loadNames(trades.flatMap(t=>[t.from,t.to]));if(tInit&&trades.some(t=>t.to===uid&&!prev.has(t.id)))flash('Un ami te propose un échange ! Va voir l’onglet Échanges.');tInit=true;if(tab==='trades')view()});
  db.collection('inbox').where('to','==',uid).onSnapshot(sn=>{
    let ch=false;
    for(const d of sn.docs){
      if(seen.has(d.id))continue;seen.add(d.id);const x=d.data();
      if(x.coins)me.coins+=x.coins;if(x.card){me.cards.push(x.card);me.st.trades++}ch=true;
      db.doc('inbox/'+d.id).delete().catch(()=>{});
    }
    if(ch){save();flash('Tu as reçu une vente ou un échange !');view()}
  });
})();
</script>
<script type="module">
/* ====== CONFIGURATION FIREBASE : colle ici les valeurs de ton projet (voir LISEZMOI.md) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDsjM7tQA75xbcXCLtLWLfz18LqoPl_MHk",
  authDomain: "garage-des-cartes.firebaseapp.com",
  projectId: "garage-des-cartes",
  appId: "1:372753287119:web:a97dbeabea85d99d3574ba"
};
/* ========================================================================================= */

const main = document.getElementById('main');

if (
  !firebaseConfig.apiKey ||
  firebaseConfig.apiKey.includes("AIzaSyDsjM7tQA75xbcXCLtLWLfz18LqoPl_MHk") ||
  !firebaseConfig.authDomain ||
  !firebaseConfig.projectId ||
  !firebaseConfig.appId
) {
  window.__openGate({});
  setTimeout(() => { main.innerHTML = '<p class="note">Le site n’est pas encore configuré : ouvre <b>index.html</b> et remplace les valeurs « COLLE_ICI » par celles de ton projet Firebase (étapes dans LISEZMOI.md).</p>'; }, 400);
} else {
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    const F = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

    const app = initializeApp(firebaseConfig);
    const auth = A.getAuth(app);
    const fs = F.getFirestore(app);

    // 1) Connexion
    let user = await new Promise(res => { const off = A.onAuthStateChanged(auth, u => { off(); res(u); }); });
    if (!user) {
      user = await new Promise(resolve => {
        const el = document.createElement('div');
        el.id = 'login';
        el.innerHTML = '<div class="box"><h2>Garage des cartes</h2><p>Connecte-toi pour retrouver ta collection et jouer avec tes amis.</p>' +
          '<button class="btn" id="lg">Se connecter avec Google</button>' +
          '<button class="btn alt" id="la">Jouer sans compte</button>' +
          '<p>Sans compte, ta collection reste liée à cet appareil : si tu effaces les données du navigateur, tu la perds.</p>' +
          '<div class="err" id="le" role="alert"></div></div>';
        document.body.appendChild(el);
        const fail = e => { document.getElementById('le').textContent = 'Connexion impossible : ' + (e && e.code ? e.code : 'erreur inconnue'); };
        document.getElementById('lg').onclick = () => A.signInWithPopup(auth, new A.GoogleAuthProvider()).then(c => { el.remove(); resolve(c.user); }).catch(fail);
        document.getElementById('la').onclick = () => A.signInAnonymously(auth).then(c => { el.remove(); resolve(c.user); }).catch(fail);
      });
    }

    // 2) Pseudo (affiché aux amis)
    const pref = F.doc(fs, 'profiles/' + user.uid);
    let ps = await F.getDoc(pref);
    if (!ps.exists() || !ps.data().name) {
      const name = await new Promise(resolve => {
        const el = document.createElement('div');
        el.id = 'login';
        el.innerHTML = '<div class="box"><h2>Choisis ton pseudo</h2><p>Tes amis le verront dans le marché, les échanges et la liste d’amis.</p>' +
          '<input id="pn" maxlength="24" placeholder="Ton pseudo" aria-label="Pseudo"><button class="btn" id="pb">Valider</button><div class="err" id="pe" role="alert"></div></div>';
        document.body.appendChild(el);
        const inp = document.getElementById('pn');
        inp.value = (user.displayName || '').slice(0, 24);
        const go = () => { const v = inp.value.trim(); if (!v) { document.getElementById('pe').textContent = 'Écris un pseudo.'; return; } el.remove(); resolve(v); };
        document.getElementById('pb').onclick = go;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        inp.focus();
      });
      await F.setDoc(pref, { name });
    }

    // 3) Adaptateurs (mêmes appels que sur claude.ai)
    const wrapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
    const wrapQuery = q => ({ onSnapshot: cb => F.onSnapshot(q, s => cb({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) }), e => console.error(e)) });
    const db = {
      doc: p => {
        const r = F.doc(fs, p);
        return {
          get: async () => wrapDoc(await F.getDoc(r)),
          set: d => F.setDoc(r, d),
          delete: () => F.deleteDoc(r),
          onSnapshot: cb => F.onSnapshot(r, s => cb(wrapDoc(s)), e => console.error(e))
        };
      },
      collection: n => {
        const c = F.collection(fs, n);
        return { ...wrapQuery(c), add: d => F.addDoc(c, d), where: (f, o, v) => wrapQuery(F.query(c, F.where(f, o, v))) };
      }
    };
    const userApi = {
      id: async () => user.uid,
      profiles: async ids => {
        const out = {};
        await Promise.all(ids.map(async id => {
          try { const s = await F.getDoc(F.doc(fs, 'profiles/' + id)); out[id] = { name: s.exists() ? (s.data().name || '') : '' }; }
          catch (e) { out[id] = { name: '' }; }
        }));
        return out;
      }
    };
    window.__openGate({ db, user: userApi }); // pas d'« assets » : l'onglet Photos reste caché
  } catch (e) {
    console.error(e);
    window.__openGate({});
  }
}
</script>
